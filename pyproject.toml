[project]
name = "deployable-web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nabil-Haddad", email = "nahaddadbil@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
deployable-web-app = "deployable_web_app:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
